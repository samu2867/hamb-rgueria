<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Brasa Burguer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h2>Fale Conosco</h2>

    <form action="https://formsubmit.co/naoseinome297@gmail.com" method="POST">

      <!-- Configurações Opcionais do Formsubmit -->
      <input type="hidden" name="_subject" value="Novo envio de formulário">
      <input type="hidden" name="_captcha" value="false">

      <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
      </p>

      <p>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea>
      </p>

      <p>
        <button type="submit">Enviar</button>
      </p>

    </form>

  </main>

</body>

</html>
